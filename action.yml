name: 'CodeSpy Code Review'
description: 'Automated code review powered by AI. Detects bugs, security vulnerabilities, and documentation issues in your PRs.'
author: 'khezen'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for PR access and posting comments. Uses GITHUB_TOKEN by default.'
    required: false
    default: ${{ github.token }}
  
  model:
    description: 'Default LLM model to use (e.g., anthropic/claude-sonnet-4-5-20250929, openai/gpt-5, bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0)'
    required: true
  
  extraction-model:
    description: 'Model for field extraction (smaller model recommended)'
    required: false
  
  pr-url:
    description: 'URL of the pull request to review. Defaults to the current PR context.'
    required: false
    default: ''
  
  post-comment:
    description: 'Post review as a Git platform PR/MR comment'
    required: false
    default: 'true'
  
  output-format:
    description: 'Output format: markdown or json'
    required: false
    default: 'markdown'
  
  # LLM Provider API Keys
  anthropic-api-key:
    description: 'Anthropic API key (for Claude models)'
    required: false
  
  openai-api-key:
    description: 'OpenAI API key (for GPT models)'
    required: false
  
  gemini-api-key:
    description: 'Google Gemini API key'
    required: false
  
  # AWS Bedrock credentials
  aws-access-key-id:
    description: 'AWS Access Key ID (for Bedrock models)'
    required: false
  
  aws-secret-access-key:
    description: 'AWS Secret Access Key (for Bedrock models)'
    required: false
  
  aws-region:
    description: 'AWS Region (for Bedrock models)'
    required: false
    default: 'us-east-1'
  
  # Global defaults
  default-max-iters:
    description: 'Default maximum iterations for all signatures'
    required: false
    default: '3'
  
  default-reasoning-effort:
    description: 'Default reasoning effort for all signatures (minimal|low|medium|high)'
    required: false
    default: 'medium'
  
  default-temperature:
    description: 'Default temperature for LLM calls'
    required: false
    default: '0.2'

  
  llm-retries:
    description: 'Number of retries for LLM API calls'
    required: false
    default: '2'
  
  llm-timeout:
    description: 'Timeout in seconds for LLM calls'
    required: false
    default: '120'
  
  enable-prompt-caching:
    description: 'Enable provider-side prompt caching (reduces latency and costs)'
    required: false
    default: 'true'

  default-max-llm-calls:
    description: 'Maximum LLM calls for RLM fallback (context overflow recovery)'
    required: false
    default: '5'

  # RLM fallback (context rot prevention)
  rlm-fallback-enabled:
    description: 'Enable proactive RLM fallback before context window overflow'
    required: false
    default: 'true'

  rlm-fallback-react-threshold:
    description: 'Context ratio for ReAct modules (0.0-1.0). RLM used when input exceeds this ratio of max_input_tokens.'
    required: false
    default: '0.30'

  rlm-fallback-chain-of-thought-threshold:
    description: 'Context ratio for ChainOfThought modules (0.0-1.0). RLM used when input exceeds this ratio.'
    required: false
    default: '0.40'

  rlm-fallback-predict-threshold:
    description: 'Context ratio for Predict modules (0.0-1.0). RLM used when input exceeds this ratio.'
    required: false
    default: '0.50'

  min-confidence:
    description: 'Minimum confidence threshold (0.0-1.0) for reported issues'
    required: false
    default: '0.81'

  # ==========================================
  # SIGNATURE: scope
  # ==========================================
  scope-enabled:
    description: 'Enable scope identification signature'
    required: false
    default: 'true'
  
  scope-model:
    description: 'Model for scope identification (empty = use default)'
    required: false
  
  scope-max-iters:
    description: 'Max iterations for scope identification'
    required: false

  scope-max-llm-calls:
    description: 'Max LLM calls for scope RLM fallback'
    required: false

  scope-reasoning-effort:
    description: 'Reasoning effort for scope (minimal|low|medium|high)'
    required: false
  
  scope-temperature:
    description: 'Temperature for scope identification'
    required: false
  
  # ==========================================
  # SIGNATURE: code_review
  # ==========================================
  code-review-enabled:
    description: 'Enable code review signature (bugs, security vulnerabilities, code smells)'
    required: false
    default: 'true'
  
  code-review-model:
    description: 'Model for code review (empty = use default)'
    required: false
  
  code-review-max-iters:
    description: 'Max iterations for code review'
    required: false

  code-review-max-llm-calls:
    description: 'Max LLM calls for code review RLM fallback'
    required: false

  code-review-reasoning-effort:
    description: 'Reasoning effort for code review (minimal|low|medium|high)'
    required: false
  
  code-review-temperature:
    description: 'Temperature for code review'
    required: false
  
  # ==========================================
  # SIGNATURE: doc
  # ==========================================
  doc-enabled:
    description: 'Enable documentation review signature (stale/wrong documentation)'
    required: false
    default: 'true'
  
  doc-model:
    description: 'Model for doc review (empty = use default)'
    required: false
  
  doc-reasoning-effort:
    description: 'Reasoning effort for doc (minimal|low|medium|high)'
    required: false
  
  doc-temperature:
    description: 'Temperature for doc review'
    required: false
  
  # ==========================================
  # SIGNATURE: supply_chain
  # ==========================================
  supply-chain-enabled:
    description: 'Enable supply chain security signature'
    required: false
    default: 'true'
  
  supply-chain-model:
    description: 'Model for supply chain security (empty = use default)'
    required: false
  
  supply-chain-max-iters:
    description: 'Max iterations for supply chain security'
    required: false

  supply-chain-max-llm-calls:
    description: 'Max LLM calls for supply chain RLM fallback'
    required: false

  supply-chain-reasoning-effort:
    description: 'Reasoning effort for supply chain (minimal|low|medium|high)'
    required: false
  
  supply-chain-temperature:
    description: 'Temperature for supply chain security'
    required: false
  
  supply-chain-scan-unchanged:
    description: 'Scan all artifacts/manifests even if not modified in the PR (default: only scan changed)'
    required: false
    default: 'false'
  
  # ==========================================
  # SIGNATURE: summary
  # ==========================================
  summary-enabled:
    description: 'Enable PR summary signature'
    required: false
    default: 'true'

  summary-model:
    description: 'Model for summary (empty = use default)'
    required: false

  summary-max-llm-calls:
    description: 'Max LLM calls for summary RLM fallback'
    required: false

  summary-reasoning-effort:
    description: 'Reasoning effort for summary (minimal|low|medium|high)'
    required: false

  summary-temperature:
    description: 'Temperature for summary'
    required: false

  # ==========================================
  # MEMORY (Hippocampus)
  # ==========================================
  memory-enabled:
    description: 'Enable memory (Hippocampus) globally for cross-run learning (default: false)'
    required: false
    default: 'false'

  memory-backend:
    description: 'Memory storage backend: filesystem or s3. Note: filesystem is ephemeral in Docker; use s3 for persistence across runs.'
    required: false
    default: 'filesystem'

  memory-root:
    description: 'Filesystem path for memory storage (only used with filesystem backend; ephemeral in Docker)'
    required: false

  memory-s3-bucket:
    description: 'S3 bucket for memory storage (required when backend is s3). Requires aws-access-key-id/aws-secret-access-key inputs.'
    required: false

  memory-s3-region:
    description: 'S3 region for memory bucket (defaults to aws-region input)'
    required: false

  memory-s3-endpoint-url:
    description: 'S3 endpoint URL for S3-compatible stores (e.g., MinIO)'
    required: false

  memory-max-reflects:
    description: 'Max online reflections per agent call (0 = batch-only, default: 0)'
    required: false
    default: '0'

  memory-distiller-model:
    description: 'Model for the Distiller reflection module (smaller model recommended)'
    required: false

  memory-distiller-reasoning-effort:
    description: 'Reasoning effort for Distiller (minimal|low|medium|high)'
    required: false

  memory-distiller-temperature:
    description: 'Temperature for Distiller'
    required: false

  memory-cartographer-model:
    description: 'Model for the Cartographer reflection module (smaller model recommended)'
    required: false

  memory-cartographer-reasoning-effort:
    description: 'Reasoning effort for Cartographer (minimal|low|medium|high)'
    required: false

  memory-cartographer-temperature:
    description: 'Temperature for Cartographer'
    required: false

  # Per-signature memory overrides
  scope-memory-enabled:
    description: 'Enable memory for scope identification (overrides global memory-enabled)'
    required: false

  code-review-memory-enabled:
    description: 'Enable memory for code review (overrides global memory-enabled)'
    required: false

  doc-memory-enabled:
    description: 'Enable memory for doc review (overrides global memory-enabled)'
    required: false

  supply-chain-memory-enabled:
    description: 'Enable memory for supply chain (overrides global memory-enabled)'
    required: false

  summary-memory-enabled:
    description: 'Enable memory for summary (overrides global memory-enabled)'
    required: false

  excluded-directories:
    description: 'JSON array of directories to exclude from review (e.g., ["vendor", "dist"])'
    required: false
  
  fail-on-critical:
    description: 'Fail the action if critical issues are found'
    required: false
    default: 'false'
  
  codespy-version:
    description: 'Version of codespy Docker image to use'
    required: false
    default: 'latest'

outputs:
  issues-count:
    description: 'Total number of issues found'
    value: ${{ steps.review.outputs.issues-count }}
  critical-count:
    description: 'Number of critical issues found'
    value: ${{ steps.review.outputs.critical-count }}
  high-count:
    description: 'Number of high severity issues found'
    value: ${{ steps.review.outputs.high-count }}
  review-output:
    description: 'The full review output'
    value: ${{ steps.review.outputs.review-output }}

runs:
  using: 'composite'
  steps:
    - name: Determine PR URL
      id: pr-url
      shell: bash
      run: |
        if [ -n "${{ inputs.pr-url }}" ]; then
          echo "url=${{ inputs.pr-url }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "pull_request_target" ]; then
          echo "url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" = "issue_comment" ]; then
          echo "url=${{ github.event.issue.pull_request.html_url }}" >> $GITHUB_OUTPUT
        else
          echo "::error::No PR URL provided and not running in PR context. Please provide pr-url input."
          exit 1
        fi

    - name: Run CodeSpy Review
      id: review
      shell: bash
      env:
        # Core settings
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DEFAULT_MODEL: ${{ inputs.model }}
        EXTRACTION_MODEL: ${{ inputs.extraction-model }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        
        # LLM provider credentials
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_REGION: ${{ inputs.aws-region }}
        
        # Global defaults
        DEFAULT_MAX_ITERS: ${{ inputs.default-max-iters }}
        DEFAULT_REASONING_EFFORT: ${{ inputs.default-reasoning-effort }}
        DEFAULT_TEMPERATURE: ${{ inputs.default-temperature }}
        LLM_RETRIES: ${{ inputs.llm-retries }}
        LLM_TIMEOUT: ${{ inputs.llm-timeout }}
        ENABLE_PROMPT_CACHING: ${{ inputs.enable-prompt-caching }}
        DEFAULT_MAX_LLM_CALLS: ${{ inputs.default-max-llm-calls }}
        MIN_CONFIDENCE: ${{ inputs.min-confidence }}

        # RLM fallback
        RLM_FALLBACK_ENABLED: ${{ inputs.rlm-fallback-enabled }}
        RLM_FALLBACK_REACT_THRESHOLD: ${{ inputs.rlm-fallback-react-threshold }}
        RLM_FALLBACK_CHAIN_OF_THOUGHT_THRESHOLD: ${{ inputs.rlm-fallback-chain-of-thought-threshold }}
        RLM_FALLBACK_PREDICT_THRESHOLD: ${{ inputs.rlm-fallback-predict-threshold }}

        # Scope identification signature
        SCOPE_ENABLED: ${{ inputs.scope-enabled }}
        SCOPE_MODEL: ${{ inputs.scope-model }}
        SCOPE_MAX_ITERS: ${{ inputs.scope-max-iters }}
        SCOPE_MAX_LLM_CALLS: ${{ inputs.scope-max-llm-calls }}
        SCOPE_REASONING_EFFORT: ${{ inputs.scope-reasoning-effort }}
        SCOPE_TEMPERATURE: ${{ inputs.scope-temperature }}
        
        # Code review signature
        CODE_REVIEW_ENABLED: ${{ inputs.code-review-enabled }}
        CODE_REVIEW_MODEL: ${{ inputs.code-review-model }}
        CODE_REVIEW_MAX_ITERS: ${{ inputs.code-review-max-iters }}
        CODE_REVIEW_MAX_LLM_CALLS: ${{ inputs.code-review-max-llm-calls }}
        CODE_REVIEW_REASONING_EFFORT: ${{ inputs.code-review-reasoning-effort }}
        CODE_REVIEW_TEMPERATURE: ${{ inputs.code-review-temperature }}
        
        # Doc review signature
        DOC_ENABLED: ${{ inputs.doc-enabled }}
        DOC_MODEL: ${{ inputs.doc-model }}
        DOC_REASONING_EFFORT: ${{ inputs.doc-reasoning-effort }}
        DOC_TEMPERATURE: ${{ inputs.doc-temperature }}
        
        # Supply chain signature
        SUPPLY_CHAIN_ENABLED: ${{ inputs.supply-chain-enabled }}
        SUPPLY_CHAIN_MODEL: ${{ inputs.supply-chain-model }}
        SUPPLY_CHAIN_MAX_ITERS: ${{ inputs.supply-chain-max-iters }}
        SUPPLY_CHAIN_MAX_LLM_CALLS: ${{ inputs.supply-chain-max-llm-calls }}
        SUPPLY_CHAIN_REASONING_EFFORT: ${{ inputs.supply-chain-reasoning-effort }}
        SUPPLY_CHAIN_TEMPERATURE: ${{ inputs.supply-chain-temperature }}
        SUPPLY_CHAIN_SCAN_UNCHANGED: ${{ inputs.supply-chain-scan-unchanged }}
        
        # Summary signature
        SUMMARY_ENABLED: ${{ inputs.summary-enabled }}
        SUMMARY_MODEL: ${{ inputs.summary-model }}
        SUMMARY_MAX_LLM_CALLS: ${{ inputs.summary-max-llm-calls }}
        SUMMARY_REASONING_EFFORT: ${{ inputs.summary-reasoning-effort }}
        SUMMARY_TEMPERATURE: ${{ inputs.summary-temperature }}
        
        # Other settings
        EXCLUDED_DIRECTORIES: ${{ inputs.excluded-directories }}

        # Memory (Hippocampus)
        MEMORY_DEFAULT_ENABLED: ${{ inputs.memory-enabled }}
        MEMORY_BACKEND: ${{ inputs.memory-backend }}
        MEMORY_ROOT: ${{ inputs.memory-root }}
        MEMORY_S3_BUCKET: ${{ inputs.memory-s3-bucket }}
        MEMORY_S3_REGION: ${{ inputs.memory-s3-region }}
        MEMORY_S3_ENDPOINT_URL: ${{ inputs.memory-s3-endpoint-url }}
        MEMORY_DEFAULT_MAX_REFLECTS: ${{ inputs.memory-max-reflects }}
        MEMORY_DISTILLER_MODEL: ${{ inputs.memory-distiller-model }}
        MEMORY_DISTILLER_REASONING_EFFORT: ${{ inputs.memory-distiller-reasoning-effort }}
        MEMORY_DISTILLER_TEMPERATURE: ${{ inputs.memory-distiller-temperature }}
        MEMORY_CARTOGRAPHER_MODEL: ${{ inputs.memory-cartographer-model }}
        MEMORY_CARTOGRAPHER_REASONING_EFFORT: ${{ inputs.memory-cartographer-reasoning-effort }}
        MEMORY_CARTOGRAPHER_TEMPERATURE: ${{ inputs.memory-cartographer-temperature }}
        SCOPE_MEMORY_ENABLED: ${{ inputs.scope-memory-enabled }}
        CODE_REVIEW_MEMORY_ENABLED: ${{ inputs.code-review-memory-enabled }}
        DOC_MEMORY_ENABLED: ${{ inputs.doc-memory-enabled }}
        SUPPLY_CHAIN_MEMORY_ENABLED: ${{ inputs.supply-chain-memory-enabled }}
        SUMMARY_MEMORY_ENABLED: ${{ inputs.summary-memory-enabled }}
      run: |
        set -eo pipefail
        
        # Build docker run arguments - add all env vars that are set
        DOCKER_ARGS="--rm"
        
        # Core settings
        DOCKER_ARGS="$DOCKER_ARGS -e GITHUB_TOKEN -e DEFAULT_MODEL -e OUTPUT_FORMAT"
        [ -n "$EXTRACTION_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e EXTRACTION_MODEL"
        
        # Add optional API keys if provided
        [ -n "$ANTHROPIC_API_KEY" ] && DOCKER_ARGS="$DOCKER_ARGS -e ANTHROPIC_API_KEY"
        [ -n "$OPENAI_API_KEY" ] && DOCKER_ARGS="$DOCKER_ARGS -e OPENAI_API_KEY"
        [ -n "$GEMINI_API_KEY" ] && DOCKER_ARGS="$DOCKER_ARGS -e GEMINI_API_KEY"
        [ -n "$AWS_ACCESS_KEY_ID" ] && DOCKER_ARGS="$DOCKER_ARGS -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION"
        
        # Global defaults
        [ -n "$DEFAULT_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e DEFAULT_MAX_ITERS"
        [ -n "$DEFAULT_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e DEFAULT_REASONING_EFFORT"
        [ -n "$DEFAULT_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e DEFAULT_TEMPERATURE"
        [ -n "$LLM_RETRIES" ] && DOCKER_ARGS="$DOCKER_ARGS -e LLM_RETRIES"
        [ -n "$LLM_TIMEOUT" ] && DOCKER_ARGS="$DOCKER_ARGS -e LLM_TIMEOUT"
        [ -n "$ENABLE_PROMPT_CACHING" ] && DOCKER_ARGS="$DOCKER_ARGS -e ENABLE_PROMPT_CACHING"
        [ -n "$DEFAULT_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e DEFAULT_MAX_LLM_CALLS"
        [ -n "$MIN_CONFIDENCE" ] && DOCKER_ARGS="$DOCKER_ARGS -e MIN_CONFIDENCE"

        # RLM fallback
        [ -n "$RLM_FALLBACK_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e RLM_FALLBACK_ENABLED"
        [ -n "$RLM_FALLBACK_REACT_THRESHOLD" ] && DOCKER_ARGS="$DOCKER_ARGS -e RLM_FALLBACK_REACT_THRESHOLD"
        [ -n "$RLM_FALLBACK_CHAIN_OF_THOUGHT_THRESHOLD" ] && DOCKER_ARGS="$DOCKER_ARGS -e RLM_FALLBACK_CHAIN_OF_THOUGHT_THRESHOLD"
        [ -n "$RLM_FALLBACK_PREDICT_THRESHOLD" ] && DOCKER_ARGS="$DOCKER_ARGS -e RLM_FALLBACK_PREDICT_THRESHOLD"

        # Scope identification
        [ -n "$SCOPE_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e SCOPE_ENABLED"
        [ -n "$SCOPE_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e SCOPE_MODEL"
        [ -n "$SCOPE_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e SCOPE_MAX_ITERS"
        [ -n "$SCOPE_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e SCOPE_MAX_LLM_CALLS"
        [ -n "$SCOPE_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e SCOPE_REASONING_EFFORT"
        [ -n "$SCOPE_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e SCOPE_TEMPERATURE"
        
        # Code review
        [ -n "$CODE_REVIEW_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e CODE_REVIEW_ENABLED"
        [ -n "$CODE_REVIEW_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e CODE_REVIEW_MODEL"
        [ -n "$CODE_REVIEW_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e CODE_REVIEW_MAX_ITERS"
        [ -n "$CODE_REVIEW_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e CODE_REVIEW_MAX_LLM_CALLS"
        [ -n "$CODE_REVIEW_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e CODE_REVIEW_REASONING_EFFORT"
        [ -n "$CODE_REVIEW_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e CODE_REVIEW_TEMPERATURE"
        
        # Doc review
        [ -n "$DOC_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e DOC_ENABLED"
        [ -n "$DOC_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e DOC_MODEL"
        [ -n "$DOC_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e DOC_REASONING_EFFORT"
        [ -n "$DOC_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e DOC_TEMPERATURE"
        
        # Supply chain
        [ -n "$SUPPLY_CHAIN_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUPPLY_CHAIN_ENABLED"
        [ -n "$SUPPLY_CHAIN_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUPPLY_CHAIN_MODEL"
        [ -n "$SUPPLY_CHAIN_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUPPLY_CHAIN_MAX_ITERS"
        [ -n "$SUPPLY_CHAIN_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUPPLY_CHAIN_MAX_LLM_CALLS"
        [ -n "$SUPPLY_CHAIN_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUPPLY_CHAIN_REASONING_EFFORT"
        [ -n "$SUPPLY_CHAIN_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUPPLY_CHAIN_TEMPERATURE"
        [ -n "$SUPPLY_CHAIN_SCAN_UNCHANGED" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUPPLY_CHAIN_SCAN_UNCHANGED"
        
        # Summary
        [ -n "$SUMMARY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUMMARY_ENABLED"
        [ -n "$SUMMARY_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUMMARY_MODEL"
        [ -n "$SUMMARY_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUMMARY_MAX_LLM_CALLS"
        [ -n "$SUMMARY_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUMMARY_REASONING_EFFORT"
        [ -n "$SUMMARY_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUMMARY_TEMPERATURE"
        
        # Other settings
        [ -n "$EXCLUDED_DIRECTORIES" ] && DOCKER_ARGS="$DOCKER_ARGS -e EXCLUDED_DIRECTORIES"

        # Memory (Hippocampus)
        [ -n "$MEMORY_DEFAULT_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DEFAULT_ENABLED"
        [ -n "$MEMORY_BACKEND" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_BACKEND"
        [ -n "$MEMORY_ROOT" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_ROOT"
        [ -n "$MEMORY_S3_BUCKET" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_S3_BUCKET"
        [ -n "$MEMORY_S3_REGION" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_S3_REGION"
        [ -n "$MEMORY_S3_ENDPOINT_URL" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_S3_ENDPOINT_URL"
        [ -n "$MEMORY_DEFAULT_MAX_REFLECTS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DEFAULT_MAX_REFLECTS"
        [ -n "$MEMORY_DISTILLER_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DISTILLER_MODEL"
        [ -n "$MEMORY_DISTILLER_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DISTILLER_REASONING_EFFORT"
        [ -n "$MEMORY_DISTILLER_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DISTILLER_TEMPERATURE"
        [ -n "$MEMORY_CARTOGRAPHER_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CARTOGRAPHER_MODEL"
        [ -n "$MEMORY_CARTOGRAPHER_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CARTOGRAPHER_REASONING_EFFORT"
        [ -n "$MEMORY_CARTOGRAPHER_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CARTOGRAPHER_TEMPERATURE"
        [ -n "$SCOPE_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e SCOPE_MEMORY_ENABLED"
        [ -n "$CODE_REVIEW_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e CODE_REVIEW_MEMORY_ENABLED"
        [ -n "$DOC_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e DOC_MEMORY_ENABLED"
        [ -n "$SUPPLY_CHAIN_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUPPLY_CHAIN_MEMORY_ENABLED"
        [ -n "$SUMMARY_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e SUMMARY_MEMORY_ENABLED"

        # Build codespy command arguments
        CMD_ARGS="review ${{ steps.pr-url.outputs.url }}"
        CMD_ARGS="$CMD_ARGS --output ${{ inputs.output-format }}"
        
        # Add git comment flag
        if [ "${{ inputs.post-comment }}" = "true" ]; then
          CMD_ARGS="$CMD_ARGS --git-comment"
        else
          CMD_ARGS="$CMD_ARGS --no-git-comment"
        fi
        
        # Create output file for capturing review
        OUTPUT_FILE=$(mktemp)
        
        # Run codespy in Docker
        docker run $DOCKER_ARGS \
          ghcr.io/khezen/codespy:${{ inputs.codespy-version }} \
          $CMD_ARGS | tee "$OUTPUT_FILE"
        
        # Extract issue counts from output
        REVIEW_OUTPUT=$(cat "$OUTPUT_FILE")
        
        # Parse issue counts from markdown output
        # Matches lines like: - **Total Issues:** 5
        TOTAL_ISSUES=$(echo "$REVIEW_OUTPUT" | grep -oP '\*\*Total Issues:\*\*\s+\K\d+' || echo "0")
        CRITICAL_COUNT=$(echo "$REVIEW_OUTPUT" | grep -oP '\*\*Critical:\*\*\s+\K\d+' || echo "0")
        HIGH_COUNT=$(echo "$REVIEW_OUTPUT" | grep -oP '\*\*High:\*\*\s+\K\d+' || echo "0")
        
        # Set outputs
        echo "issues-count=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
        echo "critical-count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
        echo "high-count=$HIGH_COUNT" >> $GITHUB_OUTPUT
        
        # Store full output (escape for multiline)
        {
          echo 'review-output<<EOF'
          cat "$OUTPUT_FILE"
          echo 'EOF'
        } >> $GITHUB_OUTPUT
        
        rm -f "$OUTPUT_FILE"

    - name: Check for critical issues
      if: inputs.fail-on-critical == 'true'
      shell: bash
      run: |
        if [ "${{ steps.review.outputs.critical-count }}" -gt "0" ]; then
          echo "::error::CodeSpy found ${{ steps.review.outputs.critical-count }} critical issue(s). Failing the action as requested."
          exit 1
        fi