name: 'CodeSpy Code Review'
description: 'Automated code review powered by AI. Detects bugs, security vulnerabilities, and documentation issues in your PRs.'
author: 'khezen'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for PR access and posting comments. Uses GITHUB_TOKEN by default.'
    required: false
    default: ${{ github.token }}
  
  model:
    description: 'Default LLM model to use (e.g., anthropic/claude-sonnet-4-5-20250929, openai/gpt-5, bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0). Affects units without a model pin. Default from codespy.yaml: bedrock/converse/nvidia.nemotron-nano-3-30b'
    required: false
  
  extraction-model:
    description: 'Model for field extraction (smaller model recommended). Default from codespy.yaml: bedrock/converse/nvidia.nemotron-nano-3-30b'
    required: false
  
  pr-url:
    description: 'URL of the pull request to review. Defaults to the current PR context.'
    required: false
    default: ''
  
  post-comment:
    description: 'Post review as a Git platform PR/MR comment'
    required: false
    default: 'true'
  
  output-format:
    description: 'Output format: markdown or json. Note: issue count parsing only understands markdown. Default from codespy.yaml: markdown'
    required: false
  
  # LLM Provider API Keys
  anthropic-api-key:
    description: 'Anthropic API key (for Claude models)'
    required: false
  
  openai-api-key:
    description: 'OpenAI API key (for GPT models)'
    required: false
  
  gemini-api-key:
    description: 'Google Gemini API key'
    required: false
  
  # AWS Bedrock credentials
  aws-access-key-id:
    description: 'AWS Access Key ID (for Bedrock models)'
    required: false

  aws-secret-access-key:
    description: 'AWS Secret Access Key (for Bedrock models)'
    required: false

  aws-region:
    description: 'AWS Region (for Bedrock models). Default from codespy.yaml: us-east-1'
    required: false

  # Global defaults
  default-max-iters:
    description: 'Default maximum iterations for all signatures. Default from codespy.yaml: 5'
    required: false

  default-reasoning-effort:
    description: 'Default reasoning effort for all signatures (minimal|low|medium|high). Default from codespy.yaml: medium'
    required: false

  default-temperature:
    description: 'Default temperature for LLM calls. Default from codespy.yaml: 1.0'
    required: false

  default-max-tokens:
    description: 'Output token budget per completion (reasoning tokens included). Clamped to model ceiling. Default from codespy.yaml: 32000'
    required: false

  llm-retries:
    description: 'Number of retries for LLM API calls. Default from codespy.yaml: 2'
    required: false

  llm-timeout:
    description: 'Timeout in seconds for LLM calls. Default from codespy.yaml: 240'
    required: false

  default-max-llm-calls:
    description: 'Maximum LLM calls for RLM fallback (context overflow recovery). Default from codespy.yaml: 8'
    required: false

  # RLM fallback (context rot prevention)
  rlm-fallback-enabled:
    description: 'Enable proactive RLM fallback before context window overflow. Default from codespy.yaml: true'
    required: false

  rlm-fallback-react-threshold:
    description: 'Context ratio for ReAct modules (0.0-1.0). RLM used when input exceeds this ratio of max_input_tokens. Default from codespy.yaml: 0.30'
    required: false

  rlm-fallback-chain-of-thought-threshold:
    description: 'Context ratio for ChainOfThought modules (0.0-1.0). RLM used when input exceeds this ratio. Default from codespy.yaml: 0.40'
    required: false

  rlm-fallback-predict-threshold:
    description: 'Context ratio for Predict modules (0.0-1.0). RLM used when input exceeds this ratio. Default from codespy.yaml: 0.50'
    required: false

  min-confidence:
    description: 'Minimum confidence threshold (0.0-1.0) for reported issues. Default from codespy.yaml: 0.81'
    required: false

  # ==========================================
  # SIGNATURE: scope
  # ==========================================
  scope-enabled:
    description: 'Enable scope identification signature. Default from codespy.yaml: true'
    required: false

  scope-model:
    description: 'Model for scope identification (empty = use default). Default from codespy.yaml: bedrock/converse/global.anthropic.claude-opus-5-5'
    required: false

  scope-max-iters:
    description: 'Max iterations for scope identification. Default from codespy.yaml: 3'
    required: false

  scope-max-llm-calls:
    description: 'Max LLM calls for scope RLM fallback. Default from codespy.yaml: 5'
    required: false

  scope-max-tokens:
    description: 'Max tokens for scope identification. Default from codespy.yaml: default-max-tokens'
    required: false

  scope-reasoning-effort:
    description: 'Reasoning effort for scope (minimal|low|medium|high). Default from codespy.yaml: medium'
    required: false

  scope-skip-refinement-when-clean:
    description: 'Skip LLM refinement when deterministic resolution is clean. Default from codespy.yaml: true'
    required: false

  scope-temperature:
    description: 'Temperature for scope identification. Default from codespy.yaml: 1.0'
    required: false

  scope-memory-enabled:
    description: 'Enable memory for scope identification (overrides global memory-enabled). Default from codespy.yaml: null (use global)'
    required: false

  # ==========================================
  # SIGNATURE: code_review
  # ==========================================
  code-review-enabled:
    description: 'Enable code review signature (bugs, security vulnerabilities, code smells). Default from codespy.yaml: true'
    required: false

  code-review-model:
    description: 'Model for code review (empty = use default). Default from codespy.yaml: bedrock/converse/global.anthropic.claude-opus-5-5'
    required: false

  code-review-max-iters:
    description: 'Max iterations for code review. Default from codespy.yaml: 5'
    required: false

  code-review-max-llm-calls:
    description: 'Max LLM calls for code review RLM fallback. Default from codespy.yaml: 8'
    required: false

  code-review-max-tokens:
    description: 'Max tokens for code review. Default from codespy.yaml: default-max-tokens'
    required: false

  code-review-reasoning-effort:
    description: 'Reasoning effort for code review (minimal|low|medium|high). Default from codespy.yaml: medium'
    required: false

  code-review-temperature:
    description: 'Temperature for code review. Default from codespy.yaml: 1.0'
    required: false

  code-review-memory-enabled:
    description: 'Enable memory for code review (overrides global memory-enabled). Default from codespy.yaml: null (use global)'
    required: false

  # ==========================================
  # SIGNATURE: doc
  # ==========================================
  doc-enabled:
    description: 'Enable documentation review signature (stale/wrong documentation). Default from codespy.yaml: true'
    required: false

  doc-model:
    description: 'Model for doc review (empty = use default). Default from codespy.yaml: bedrock/converse/global.anthropic.claude-opus-5-5'
    required: false

  doc-max-iters:
    description: 'Max iterations for doc review. Default from codespy.yaml: 2'
    required: false

  doc-max-llm-calls:
    description: 'Max LLM calls for doc review RLM fallback. Default from codespy.yaml: 4'
    required: false

  doc-max-tokens:
    description: 'Max tokens for doc review. Default from codespy.yaml: default-max-tokens'
    required: false

  doc-reasoning-effort:
    description: 'Reasoning effort for doc (minimal|low|medium|high). Default from codespy.yaml: medium'
    required: false

  doc-temperature:
    description: 'Temperature for doc review. Default from codespy.yaml: 1.0'
    required: false

  doc-memory-enabled:
    description: 'Enable memory for doc review (overrides global memory-enabled). Default from codespy.yaml: null (use global)'
    required: false

  # ==========================================
  # SIGNATURE: supply_chain
  # ==========================================
  supply-chain-enabled:
    description: 'Enable supply chain security signature. Default from codespy.yaml: true'
    required: false

  supply-chain-model:
    description: 'Model for supply chain security (empty = use default). Default from codespy.yaml: bedrock/converse/nvidia.nemotron-super-3-120b'
    required: false

  supply-chain-max-iters:
    description: 'Max iterations for supply chain security. Default from codespy.yaml: null (use default-max-iters)'
    required: false

  supply-chain-max-llm-calls:
    description: 'Max LLM calls for supply chain RLM fallback. Default from codespy.yaml: null (use default-max-llm-calls)'
    required: false

  supply-chain-max-tokens:
    description: 'Max tokens for supply chain. Default from codespy.yaml: default-max-tokens'
    required: false

  supply-chain-reasoning-effort:
    description: 'Reasoning effort for supply chain (minimal|low|medium|high). Default from codespy.yaml: medium'
    required: false

  supply-chain-temperature:
    description: 'Temperature for supply chain security. Default from codespy.yaml: 1.0'
    required: false

  supply-chain-scan-unchanged:
    description: 'Scan all artifacts/manifests even if not modified in the PR (default: only scan changed). Default from codespy.yaml: false'
    required: false

  supply-chain-memory-enabled:
    description: 'Enable memory for supply chain (overrides global memory-enabled). Default from codespy.yaml: null (use global)'
    required: false

  # ==========================================
  # SIGNATURE: summary
  # ==========================================
  summary-enabled:
    description: 'Enable PR summary signature. Default from codespy.yaml: true'
    required: false

  summary-max-iters:
    description: 'Max iterations for summary. Default from codespy.yaml: 1'
    required: false

  summary-model:
    description: 'Model for summary (empty = use default). Default from codespy.yaml: bedrock/converse/nvidia.nemotron-super-3-120b'
    required: false

  summary-max-llm-calls:
    description: 'Max LLM calls for summary RLM fallback. Default from codespy.yaml: 2'
    required: false

  summary-max-tokens:
    description: 'Max tokens for summary. Default from codespy.yaml: default-max-tokens'
    required: false

  summary-reasoning-effort:
    description: 'Reasoning effort for summary (minimal|low|medium|high). Default from codespy.yaml: medium'
    required: false

  summary-temperature:
    description: 'Temperature for summary. Default from codespy.yaml: 1.0'
    required: false

  summary-memory-enabled:
    description: 'Enable memory for summary (overrides global memory-enabled). Default from codespy.yaml: null (use global)'
    required: false

  # ==========================================
  # SIGNATURE: audit
  # ==========================================
  audit-enabled:
    description: 'Enable audit signature (quality assessment + recommendation). Default from codespy.yaml: true'
    required: false

  audit-model:
    description: 'Model for audit (empty = use default). Default from codespy.yaml: bedrock/converse/global.anthropic.claude-opus-5-5'
    required: false

  audit-max-iters:
    description: 'Max iterations for audit. Default from codespy.yaml: 1'
    required: false

  audit-max-llm-calls:
    description: 'Max LLM calls for audit RLM fallback. Default from codespy.yaml: 2'
    required: false

  audit-max-tokens:
    description: 'Max tokens for audit. Default from codespy.yaml: default-max-tokens'
    required: false

  audit-reasoning-effort:
    description: 'Reasoning effort for audit (minimal|low|medium|high). Default from codespy.yaml: medium'
    required: false

  audit-temperature:
    description: 'Temperature for audit. Default from codespy.yaml: 1.0'
    required: false

  audit-memory-enabled:
    description: 'Enable memory for audit (overrides global memory-enabled). Default from codespy.yaml: null (use global)'
    required: false

  # ==========================================
  # MEMORY (Hippocampus)
  # ==========================================
  memory-enabled:
    description: 'Enable memory (Hippocampus) globally for cross-run learning. Default from codespy.yaml: false'
    required: false

  memory-postgres-host:
    description: 'PostgreSQL host for memory storage (e.g., rds-host.amazonaws.com). When unset, pg0-embedded auto-starts.'
    required: false

  memory-postgres-port:
    description: 'PostgreSQL port. Default from codespy.yaml: 5432'
    required: false

  memory-postgres-user:
    description: 'PostgreSQL user (falls back to postgres if unset)'
    required: false

  memory-postgres-password:
    description: 'PostgreSQL password'
    required: false

  memory-postgres-database:
    description: 'PostgreSQL database name. Default from codespy.yaml: codespy'
    required: false

  memory-bank-id:
    description: 'Bank ID scoping all memory data (e.g., project name or agent name). Default from codespy.yaml: codebase'
    required: false

  memory-compact-trajectory:
    description: 'Apply head+tail trajectory bounding before distillation. Default from codespy.yaml: true'
    required: false

  memory-max-hippocampus-tokens:
    description: 'Ceiling on persisted context memory. Default from codespy.yaml: 16384'
    required: false

  memory-max-hippocampus-item-tokens:
    description: 'Soft per-observation token limit. Default from codespy.yaml: 512'
    required: false

  memory-max-trajectory-tokens:
    description: 'Cap on trajectory fed to Distiller. Default from codespy.yaml: 16384'
    required: false

  memory-max-question-tokens:
    description: 'Cap on serialized inputs as reflection question. Default from codespy.yaml: 8192'
    required: false

  memory-distiller-model:
    description: 'Model for the Distiller reflection module. Default from codespy.yaml: bedrock/converse/nvidia.nemotron-super-3-120b'
    required: false

  memory-distiller-reasoning-effort:
    description: 'Reasoning effort for Distiller (minimal|low|medium|high). Default from codespy.yaml: medium'
    required: false

  memory-distiller-temperature:
    description: 'Temperature for Distiller. Default from codespy.yaml: 1.0'
    required: false

  memory-distiller-max-tokens:
    description: 'Max tokens for Distiller. Default from codespy.yaml: default-max-tokens'
    required: false

  memory-distiller-max-iters:
    description: 'Max RLM iterations for Distiller. Default from codespy.yaml: 1'
    required: false

  memory-distiller-max-llm-calls:
    description: 'Max RLM LLM calls for Distiller. Default from codespy.yaml: 2'
    required: false

  memory-cartographer-model:
    description: 'Model for the Cartographer reflection module. Default from codespy.yaml: bedrock/converse/nvidia.nemotron-super-3-120b'
    required: false

  memory-cartographer-reasoning-effort:
    description: 'Reasoning effort for Cartographer (minimal|low|medium|high). Default from codespy.yaml: medium'
    required: false

  memory-cartographer-temperature:
    description: 'Temperature for Cartographer. Default from codespy.yaml: 1.0'
    required: false

  memory-cartographer-max-tokens:
    description: 'Max tokens for Cartographer. Default from codespy.yaml: default-max-tokens'
    required: false

  memory-cartographer-max-iters:
    description: 'Max RLM iterations for Cartographer. Default from codespy.yaml: 1'
    required: false

  memory-cartographer-max-llm-calls:
    description: 'Max RLM LLM calls for Cartographer. Default from codespy.yaml: 2'
    required: false

  # ==========================================
  # MEMORY (Cerebral — semantic memory)
  # ==========================================
  memory-retain-model:
    description: 'Model for Cerebral fact extraction. Default from codespy.yaml: bedrock/converse/nvidia.nemotron-super-3-120b'
    required: false

  memory-retain-chunk-size:
    description: 'Chars per Cerebral fact-extraction chunk (must be < 64000). Default from codespy.yaml: 12288'
    required: false

  memory-consolidation-model:
    description: 'Model for Cerebral consolidation. Default from codespy.yaml: bedrock/converse/nvidia.nemotron-super-3-120b'
    required: false

  memory-consolidation-max-observations-per-scope:
    description: 'Per-scope observation cap (-1 = unlimited, 0 = no new observations). Default from codespy.yaml: 100'
    required: false

  memory-mental-models-model:
    description: 'Model for mental-model briefing refresh. Default from codespy.yaml: bedrock/converse/nvidia.nemotron-super-3-120b'
    required: false

  memory-mental-models-max-tokens:
    description: 'Briefing size. Default from codespy.yaml: 2048'
    required: false

  memory-mental-models-min-refresh-seconds:
    description: 'Minimum seconds between automatic briefing refreshes. Default from codespy.yaml: 0'
    required: false

  memory-recall-model:
    description: 'Model for Prefrontal recall and briefing fallback. Default from codespy.yaml: bedrock/converse/nvidia.nemotron-super-3-120b'
    required: false

  memory-recall-reach:
    description: 'Recall reach: local (this repo only), org (same owner), or bank (all repos). Default from codespy.yaml: org'
    required: false

  memory-recall-max-tokens:
    description: 'Pre-call context token budget. Default from codespy.yaml: 8192'
    required: false

  memory-recall-max-tool-tokens:
    description: 'Recall memory tool result token budget. Default from codespy.yaml: 2048'
    required: false

  memory-recall-max-tool-calls:
    description: 'Recall memory tool calls per agent (0 = tool off). Default from codespy.yaml: 0'
    required: false

  memory-prefrontal-reflects:
    description: 'Reflect iterations for recall and briefings (0 = raw-fact recall, no LLM, no briefings). Default from codespy.yaml: 3'
    required: false

  memory-embeddings-model:
    description: 'litellm embedding model for Cerebral. Default from codespy.yaml: bedrock/cohere.embed-v4:0'
    required: false

  memory-embeddings-max-input-chars:
    description: 'Maximum characters per embedding input (null=auto per model, 0=off). Default from codespy.yaml: null (auto)'
    required: false

  # Per-signature memory overrides (already defined above)

  excluded-directories:
    description: 'JSON array of directories to exclude from review (e.g., ["vendor", "dist"])'
    required: false
  
  fail-on-critical:
    description: 'Fail the action if critical issues are found'
    required: false
    default: 'false'
  
  codespy-version:
    description: 'Version of codespy Docker image to use'
    required: false
    default: 'latest'

outputs:
  issues-count:
    description: 'Total number of issues found'
    value: ${{ steps.review.outputs.issues-count }}
  critical-count:
    description: 'Number of critical issues found'
    value: ${{ steps.review.outputs.critical-count }}
  high-count:
    description: 'Number of high severity issues found'
    value: ${{ steps.review.outputs.high-count }}
  review-output:
    description: 'The full review output'
    value: ${{ steps.review.outputs.review-output }}

runs:
  using: 'composite'
  steps:
    - name: Determine PR URL
      id: pr-url
      shell: bash
      run: |
        if [ -n "${{ inputs.pr-url }}" ]; then
          echo "url=${{ inputs.pr-url }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "pull_request_target" ]; then
          echo "url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" = "issue_comment" ]; then
          echo "url=${{ github.event.issue.pull_request.html_url }}" >> $GITHUB_OUTPUT
        else
          echo "::error::No PR URL provided and not running in PR context. Please provide pr-url input."
          exit 1
        fi

    - name: Run CodeSpy Review
      id: review
      shell: bash
      env:
        # Core settings
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DEFAULT_MODEL: ${{ inputs.model }}
        EXTRACTION_MODEL: ${{ inputs.extraction-model }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        
        # LLM provider credentials
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_REGION: ${{ inputs.aws-region }}
        
        # Global defaults
        DEFAULT_MAX_ITERS: ${{ inputs.default-max-iters }}
        DEFAULT_REASONING_EFFORT: ${{ inputs.default-reasoning-effort }}
        DEFAULT_TEMPERATURE: ${{ inputs.default-temperature }}
        DEFAULT_MAX_TOKENS: ${{ inputs.default-max-tokens }}
        LLM_RETRIES: ${{ inputs.llm-retries }}
        LLM_TIMEOUT: ${{ inputs.llm-timeout }}
        DEFAULT_MAX_LLM_CALLS: ${{ inputs.default-max-llm-calls }}
        REVIEW_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        REVIEW_EXCLUDED_DIRECTORIES: ${{ inputs.excluded-directories }}

        # RLM fallback
        RLM_FALLBACK_ENABLED: ${{ inputs.rlm-fallback-enabled }}
        RLM_FALLBACK_REACT_THRESHOLD: ${{ inputs.rlm-fallback-react-threshold }}
        RLM_FALLBACK_CHAIN_OF_THOUGHT_THRESHOLD: ${{ inputs.rlm-fallback-chain-of-thought-threshold }}
        RLM_FALLBACK_PREDICT_THRESHOLD: ${{ inputs.rlm-fallback-predict-threshold }}

        # Scope identification signature
        REVIEW_SCOPE_ENABLED: ${{ inputs.scope-enabled }}
        REVIEW_SCOPE_MODEL: ${{ inputs.scope-model }}
        REVIEW_SCOPE_MAX_ITERS: ${{ inputs.scope-max-iters }}
        REVIEW_SCOPE_MAX_LLM_CALLS: ${{ inputs.scope-max-llm-calls }}
        REVIEW_SCOPE_MAX_TOKENS: ${{ inputs.scope-max-tokens }}
        REVIEW_SCOPE_REASONING_EFFORT: ${{ inputs.scope-reasoning-effort }}
        REVIEW_SCOPE_TEMPERATURE: ${{ inputs.scope-temperature }}
        REVIEW_SCOPE_SKIP_REFINEMENT_WHEN_CLEAN: ${{ inputs.scope-skip-refinement-when-clean }}
        REVIEW_SCOPE_MEMORY_ENABLED: ${{ inputs.scope-memory-enabled }}

        # Code review signature
        REVIEW_CODE_REVIEW_ENABLED: ${{ inputs.code-review-enabled }}
        REVIEW_CODE_REVIEW_MODEL: ${{ inputs.code-review-model }}
        REVIEW_CODE_REVIEW_MAX_ITERS: ${{ inputs.code-review-max-iters }}
        REVIEW_CODE_REVIEW_MAX_LLM_CALLS: ${{ inputs.code-review-max-llm-calls }}
        REVIEW_CODE_REVIEW_REASONING_EFFORT: ${{ inputs.code-review-reasoning-effort }}
        REVIEW_CODE_REVIEW_TEMPERATURE: ${{ inputs.code-review-temperature }}
        REVIEW_CODE_REVIEW_MEMORY_ENABLED: ${{ inputs.code-review-memory-enabled }}

        # Doc review signature
        REVIEW_DOC_ENABLED: ${{ inputs.doc-enabled }}
        REVIEW_DOC_MODEL: ${{ inputs.doc-model }}
        REVIEW_DOC_MAX_ITERS: ${{ inputs.doc-max-iters }}
        REVIEW_DOC_MAX_LLM_CALLS: ${{ inputs.doc-max-llm-calls }}
        REVIEW_DOC_REASONING_EFFORT: ${{ inputs.doc-reasoning-effort }}
        REVIEW_DOC_TEMPERATURE: ${{ inputs.doc-temperature }}
        REVIEW_DOC_MEMORY_ENABLED: ${{ inputs.doc-memory-enabled }}

        # Supply chain signature
        REVIEW_SUPPLY_CHAIN_ENABLED: ${{ inputs.supply-chain-enabled }}
        REVIEW_SUPPLY_CHAIN_MODEL: ${{ inputs.supply-chain-model }}
        REVIEW_SUPPLY_CHAIN_MAX_ITERS: ${{ inputs.supply-chain-max-iters }}
        REVIEW_SUPPLY_CHAIN_MAX_LLM_CALLS: ${{ inputs.supply-chain-max-llm-calls }}
        REVIEW_SUPPLY_CHAIN_REASONING_EFFORT: ${{ inputs.supply-chain-reasoning-effort }}
        REVIEW_SUPPLY_CHAIN_TEMPERATURE: ${{ inputs.supply-chain-temperature }}
        REVIEW_SUPPLY_CHAIN_SCAN_UNCHANGED: ${{ inputs.supply-chain-scan-unchanged }}
        REVIEW_SUPPLY_CHAIN_MEMORY_ENABLED: ${{ inputs.supply-chain-memory-enabled }}

        # Summary signature
        REVIEW_SUMMARY_ENABLED: ${{ inputs.summary-enabled }}
        REVIEW_SUMMARY_MAX_ITERS: ${{ inputs.summary-max-iters }}
        REVIEW_SUMMARY_MODEL: ${{ inputs.summary-model }}
        REVIEW_SUMMARY_MAX_LLM_CALLS: ${{ inputs.summary-max-llm-calls }}
        REVIEW_SUMMARY_REASONING_EFFORT: ${{ inputs.summary-reasoning-effort }}
        REVIEW_SUMMARY_TEMPERATURE: ${{ inputs.summary-temperature }}
        REVIEW_SUMMARY_MEMORY_ENABLED: ${{ inputs.summary-memory-enabled }}

        # Audit signature
        REVIEW_AUDIT_ENABLED: ${{ inputs.audit-enabled }}
        REVIEW_AUDIT_MODEL: ${{ inputs.audit-model }}
        REVIEW_AUDIT_MAX_ITERS: ${{ inputs.audit-max-iters }}
        REVIEW_AUDIT_MAX_LLM_CALLS: ${{ inputs.audit-max-llm-calls }}
        REVIEW_AUDIT_REASONING_EFFORT: ${{ inputs.audit-reasoning-effort }}
        REVIEW_AUDIT_TEMPERATURE: ${{ inputs.audit-temperature }}
        REVIEW_AUDIT_MEMORY_ENABLED: ${{ inputs.audit-memory-enabled }}

        # Output settings (REVIEW_OUTPUT_FORMAT removed - only via CLI flag)

        # Memory (Hippocampus)
        MEMORY_ENABLED: ${{ inputs.memory-enabled }}
        MEMORY_POSTGRES_HOST: ${{ inputs.memory-postgres-host }}
        MEMORY_POSTGRES_PORT: ${{ inputs.memory-postgres-port }}
        MEMORY_POSTGRES_USER: ${{ inputs.memory-postgres-user }}
        MEMORY_POSTGRES_PASSWORD: ${{ inputs.memory-postgres-password }}
        MEMORY_POSTGRES_DATABASE: ${{ inputs.memory-postgres-database }}
        MEMORY_BANK_ID: ${{ inputs.memory-bank-id }}
        MEMORY_DISTILLER_MODEL: ${{ inputs.memory-distiller-model }}
        MEMORY_DISTILLER_REASONING_EFFORT: ${{ inputs.memory-distiller-reasoning-effort }}
        MEMORY_DISTILLER_TEMPERATURE: ${{ inputs.memory-distiller-temperature }}
        MEMORY_DISTILLER_MAX_ITERS: ${{ inputs.memory-distiller-max-iters }}
        MEMORY_DISTILLER_MAX_LLM_CALLS: ${{ inputs.memory-distiller-max-llm-calls }}
        MEMORY_CARTOGRAPHER_MODEL: ${{ inputs.memory-cartographer-model }}
        MEMORY_CARTOGRAPHER_REASONING_EFFORT: ${{ inputs.memory-cartographer-reasoning-effort }}
        MEMORY_CARTOGRAPHER_TEMPERATURE: ${{ inputs.memory-cartographer-temperature }}
        MEMORY_CARTOGRAPHER_MAX_ITERS: ${{ inputs.memory-cartographer-max-iters }}
        MEMORY_CARTOGRAPHER_MAX_LLM_CALLS: ${{ inputs.memory-cartographer-max-llm-calls }}
        MEMORY_RETAIN_MODEL: ${{ inputs.memory-retain-model }}
        MEMORY_CONSOLIDATION_MODEL: ${{ inputs.memory-consolidation-model }}
        MEMORY_CONSOLIDATION_MAX_OBSERVATIONS_PER_SCOPE: ${{ inputs.memory-consolidation-max-observations-per-scope }}
        MEMORY_COMPACT_TRAJECTORY: ${{ inputs.memory-compact-trajectory }}
        MEMORY_MAX_HIPPOCAMPUS_TOKENS: ${{ inputs.memory-max-hippocampus-tokens }}
        MEMORY_MAX_HIPPOCAMPUS_ITEM_TOKENS: ${{ inputs.memory-max-hippocampus-item-tokens }}
        MEMORY_MAX_TRAJECTORY_TOKENS: ${{ inputs.memory-max-trajectory-tokens }}
        MEMORY_MAX_QUESTION_TOKENS: ${{ inputs.memory-max-question-tokens }}
        MEMORY_DISTILLER_MAX_TOKENS: ${{ inputs.memory-distiller-max-tokens }}
        MEMORY_CARTOGRAPHER_MAX_TOKENS: ${{ inputs.memory-cartographer-max-tokens }}
        MEMORY_MENTAL_MODELS_MODEL: ${{ inputs.memory-mental-models-model }}
        MEMORY_MENTAL_MODELS_MAX_TOKENS: ${{ inputs.memory-mental-models-max-tokens }}
        MEMORY_MENTAL_MODELS_MIN_REFRESH_SECONDS: ${{ inputs.memory-mental-models-min-refresh-seconds }}
        MEMORY_EMBEDDINGS_MAX_INPUT_CHARS: ${{ inputs.memory-embeddings-max-input-chars }}
        MEMORY_PREFRONTAL_REFLECTS: ${{ inputs.memory-prefrontal-reflects }}
        MEMORY_RECALL_MODEL: ${{ inputs.memory-recall-model }}
        MEMORY_RECALL_REACH: ${{ inputs.memory-recall-reach }}
        MEMORY_RECALL_MAX_TOKENS: ${{ inputs.memory-recall-max-tokens }}
        MEMORY_RECALL_MAX_TOOL_TOKENS: ${{ inputs.memory-recall-max-tool-tokens }}
        MEMORY_RECALL_MAX_TOOL_CALLS: ${{ inputs.memory-recall-max-tool-calls }}
        MEMORY_EMBEDDINGS_MODEL: ${{ inputs.memory-embeddings-model }}
        MEMORY_RETAIN_CHUNK_SIZE: ${{ inputs.memory-retain-chunk-size }}
      run: |
        set -eo pipefail
        
        # Build docker run arguments - add all env vars that are set
        DOCKER_ARGS="--rm --network host"
        
        # Core settings
        DOCKER_ARGS="$DOCKER_ARGS -e GITHUB_TOKEN"
        [ -n "$DEFAULT_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e DEFAULT_MODEL"
        [ -n "$EXTRACTION_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e EXTRACTION_MODEL"
        
        # Add optional API keys if provided
        [ -n "$ANTHROPIC_API_KEY" ] && DOCKER_ARGS="$DOCKER_ARGS -e ANTHROPIC_API_KEY"
        [ -n "$OPENAI_API_KEY" ] && DOCKER_ARGS="$DOCKER_ARGS -e OPENAI_API_KEY"
        [ -n "$GEMINI_API_KEY" ] && DOCKER_ARGS="$DOCKER_ARGS -e GEMINI_API_KEY"
        [ -n "$AWS_ACCESS_KEY_ID" ] && DOCKER_ARGS="$DOCKER_ARGS -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY"
        [ -n "$AWS_REGION" ] && DOCKER_ARGS="$DOCKER_ARGS -e AWS_REGION"
        
        # Global defaults
        [ -n "$DEFAULT_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e DEFAULT_MAX_ITERS"
        [ -n "$DEFAULT_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e DEFAULT_REASONING_EFFORT"
        [ -n "$DEFAULT_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e DEFAULT_TEMPERATURE"
        [ -n "$DEFAULT_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e DEFAULT_MAX_TOKENS"
        [ -n "$LLM_RETRIES" ] && DOCKER_ARGS="$DOCKER_ARGS -e LLM_RETRIES"
        [ -n "$LLM_TIMEOUT" ] && DOCKER_ARGS="$DOCKER_ARGS -e LLM_TIMEOUT"
        [ -n "$DEFAULT_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e DEFAULT_MAX_LLM_CALLS"
        [ -n "$REVIEW_MIN_CONFIDENCE" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_MIN_CONFIDENCE"
        [ -n "$REVIEW_EXCLUDED_DIRECTORIES" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_EXCLUDED_DIRECTORIES"

        # RLM fallback
        [ -n "$RLM_FALLBACK_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e RLM_FALLBACK_ENABLED"
        [ -n "$RLM_FALLBACK_REACT_THRESHOLD" ] && DOCKER_ARGS="$DOCKER_ARGS -e RLM_FALLBACK_REACT_THRESHOLD"
        [ -n "$RLM_FALLBACK_CHAIN_OF_THOUGHT_THRESHOLD" ] && DOCKER_ARGS="$DOCKER_ARGS -e RLM_FALLBACK_CHAIN_OF_THOUGHT_THRESHOLD"
        [ -n "$RLM_FALLBACK_PREDICT_THRESHOLD" ] && DOCKER_ARGS="$DOCKER_ARGS -e RLM_FALLBACK_PREDICT_THRESHOLD"

        # Scope identification
        [ -n "$REVIEW_SCOPE_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SCOPE_ENABLED"
        [ -n "$REVIEW_SCOPE_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SCOPE_MODEL"
        [ -n "$REVIEW_SCOPE_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SCOPE_MAX_ITERS"
        [ -n "$REVIEW_SCOPE_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SCOPE_MAX_LLM_CALLS"
        [ -n "$REVIEW_SCOPE_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SCOPE_MAX_TOKENS"
        [ -n "$REVIEW_SCOPE_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SCOPE_REASONING_EFFORT"
        [ -n "$REVIEW_SCOPE_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SCOPE_TEMPERATURE"
        [ -n "$REVIEW_SCOPE_SKIP_REFINEMENT_WHEN_CLEAN" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SCOPE_SKIP_REFINEMENT_WHEN_CLEAN"
        [ -n "$REVIEW_SCOPE_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SCOPE_MEMORY_ENABLED"

        # Code review
        [ -n "$REVIEW_CODE_REVIEW_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_CODE_REVIEW_ENABLED"
        [ -n "$REVIEW_CODE_REVIEW_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_CODE_REVIEW_MODEL"
        [ -n "$REVIEW_CODE_REVIEW_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_CODE_REVIEW_MAX_ITERS"
        [ -n "$REVIEW_CODE_REVIEW_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_CODE_REVIEW_MAX_LLM_CALLS"
        [ -n "$REVIEW_CODE_REVIEW_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_CODE_REVIEW_REASONING_EFFORT"
        [ -n "$REVIEW_CODE_REVIEW_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_CODE_REVIEW_TEMPERATURE"
        [ -n "$REVIEW_CODE_REVIEW_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_CODE_REVIEW_MEMORY_ENABLED"

        # Per-signature max_tokens
        [ -n "$REVIEW_SCOPE_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SCOPE_MAX_TOKENS"
        [ -n "$REVIEW_CODE_REVIEW_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_CODE_REVIEW_MAX_TOKENS"
        [ -n "$REVIEW_DOC_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_DOC_MAX_TOKENS"
        [ -n "$REVIEW_SUPPLY_CHAIN_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUPPLY_CHAIN_MAX_TOKENS"
        [ -n "$REVIEW_SUMMARY_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUMMARY_MAX_TOKENS"
        [ -n "$REVIEW_AUDIT_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_AUDIT_MAX_TOKENS"

        # Memory module max_tokens
        [ -n "$MEMORY_DISTILLER_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DISTILLER_MAX_TOKENS"
        [ -n "$MEMORY_CARTOGRAPHER_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CARTOGRAPHER_MAX_TOKENS"

        # Doc review
        [ -n "$REVIEW_DOC_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_DOC_ENABLED"
        [ -n "$REVIEW_DOC_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_DOC_MODEL"
        [ -n "$REVIEW_DOC_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_DOC_MAX_ITERS"
        [ -n "$REVIEW_DOC_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_DOC_MAX_LLM_CALLS"
        [ -n "$REVIEW_DOC_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_DOC_REASONING_EFFORT"
        [ -n "$REVIEW_DOC_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_DOC_TEMPERATURE"
        [ -n "$REVIEW_DOC_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_DOC_MEMORY_ENABLED"

        # Supply chain
        [ -n "$REVIEW_SUPPLY_CHAIN_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUPPLY_CHAIN_ENABLED"
        [ -n "$REVIEW_SUPPLY_CHAIN_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUPPLY_CHAIN_MODEL"
        [ -n "$REVIEW_SUPPLY_CHAIN_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUPPLY_CHAIN_MAX_ITERS"
        [ -n "$REVIEW_SUPPLY_CHAIN_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUPPLY_CHAIN_MAX_LLM_CALLS"
        [ -n "$REVIEW_SUPPLY_CHAIN_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUPPLY_CHAIN_REASONING_EFFORT"
        [ -n "$REVIEW_SUPPLY_CHAIN_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUPPLY_CHAIN_TEMPERATURE"
        [ -n "$REVIEW_SUPPLY_CHAIN_SCAN_UNCHANGED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUPPLY_CHAIN_SCAN_UNCHANGED"
        [ -n "$REVIEW_SUPPLY_CHAIN_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUPPLY_CHAIN_MEMORY_ENABLED"

        # Summary
        [ -n "$REVIEW_SUMMARY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUMMARY_ENABLED"
        [ -n "$REVIEW_SUMMARY_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUMMARY_MAX_ITERS"
        [ -n "$REVIEW_SUMMARY_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUMMARY_MODEL"
        [ -n "$REVIEW_SUMMARY_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUMMARY_MAX_LLM_CALLS"
        [ -n "$REVIEW_SUMMARY_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUMMARY_REASONING_EFFORT"
        [ -n "$REVIEW_SUMMARY_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUMMARY_TEMPERATURE"
        [ -n "$REVIEW_SUMMARY_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_SUMMARY_MEMORY_ENABLED"

        # Audit
        [ -n "$REVIEW_AUDIT_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_AUDIT_ENABLED"
        [ -n "$REVIEW_AUDIT_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_AUDIT_MODEL"
        [ -n "$REVIEW_AUDIT_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_AUDIT_MAX_ITERS"
        [ -n "$REVIEW_AUDIT_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_AUDIT_MAX_LLM_CALLS"
        [ -n "$REVIEW_AUDIT_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_AUDIT_REASONING_EFFORT"
        [ -n "$REVIEW_AUDIT_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_AUDIT_TEMPERATURE"
        [ -n "$REVIEW_AUDIT_MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e REVIEW_AUDIT_MEMORY_ENABLED"

        # Output settings (REVIEW_OUTPUT_FORMAT removed - only via CLI flag)

        # Memory (Hippocampus)
        [ -n "$MEMORY_ENABLED" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_ENABLED"
        [ -n "$MEMORY_POSTGRES_HOST" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_POSTGRES_HOST"
        [ -n "$MEMORY_POSTGRES_PORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_POSTGRES_PORT"
        [ -n "$MEMORY_POSTGRES_USER" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_POSTGRES_USER"
        [ -n "$MEMORY_POSTGRES_PASSWORD" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_POSTGRES_PASSWORD"
        [ -n "$MEMORY_POSTGRES_DATABASE" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_POSTGRES_DATABASE"
        [ -n "$MEMORY_BANK_ID" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_BANK_ID"
        [ -n "$MEMORY_DISTILLER_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DISTILLER_MODEL"
        [ -n "$MEMORY_DISTILLER_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DISTILLER_REASONING_EFFORT"
        [ -n "$MEMORY_DISTILLER_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DISTILLER_TEMPERATURE"
        [ -n "$MEMORY_DISTILLER_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DISTILLER_MAX_ITERS"
        [ -n "$MEMORY_DISTILLER_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DISTILLER_MAX_LLM_CALLS"
        [ -n "$MEMORY_CARTOGRAPHER_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CARTOGRAPHER_MODEL"
        [ -n "$MEMORY_CARTOGRAPHER_REASONING_EFFORT" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CARTOGRAPHER_REASONING_EFFORT"
        [ -n "$MEMORY_CARTOGRAPHER_TEMPERATURE" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CARTOGRAPHER_TEMPERATURE"
        [ -n "$MEMORY_CARTOGRAPHER_MAX_ITERS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CARTOGRAPHER_MAX_ITERS"
        [ -n "$MEMORY_CARTOGRAPHER_MAX_LLM_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CARTOGRAPHER_MAX_LLM_CALLS"
        [ -n "$MEMORY_RETAIN_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_RETAIN_MODEL"
        [ -n "$MEMORY_CONSOLIDATION_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CONSOLIDATION_MODEL"
        [ -n "$MEMORY_CONSOLIDATION_MAX_OBSERVATIONS_PER_SCOPE" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CONSOLIDATION_MAX_OBSERVATIONS_PER_SCOPE"
        [ -n "$MEMORY_COMPACT_TRAJECTORY" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_COMPACT_TRAJECTORY"
        [ -n "$MEMORY_MAX_HIPPOCAMPUS_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_MAX_HIPPOCAMPUS_TOKENS"
        [ -n "$MEMORY_MAX_HIPPOCAMPUS_ITEM_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_MAX_HIPPOCAMPUS_ITEM_TOKENS"
        [ -n "$MEMORY_MAX_TRAJECTORY_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_MAX_TRAJECTORY_TOKENS"
        [ -n "$MEMORY_MAX_QUESTION_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_MAX_QUESTION_TOKENS"
        [ -n "$MEMORY_DISTILLER_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_DISTILLER_MAX_TOKENS"
        [ -n "$MEMORY_CARTOGRAPHER_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_CARTOGRAPHER_MAX_TOKENS"
        [ -n "$MEMORY_MENTAL_MODELS_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_MENTAL_MODELS_MODEL"
        [ -n "$MEMORY_MENTAL_MODELS_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_MENTAL_MODELS_MAX_TOKENS"
        [ -n "$MEMORY_MENTAL_MODELS_MIN_REFRESH_SECONDS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_MENTAL_MODELS_MIN_REFRESH_SECONDS"
        [ -n "$MEMORY_EMBEDDINGS_MAX_INPUT_CHARS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_EMBEDDINGS_MAX_INPUT_CHARS"
        [ -n "$MEMORY_PREFRONTAL_REFLECTS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_PREFRONTAL_REFLECTS"
        [ -n "$MEMORY_RECALL_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_RECALL_MODEL"
        [ -n "$MEMORY_RECALL_REACH" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_RECALL_REACH"
        [ -n "$MEMORY_RECALL_MAX_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_RECALL_MAX_TOKENS"
        [ -n "$MEMORY_RECALL_MAX_TOOL_TOKENS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_RECALL_MAX_TOOL_TOKENS"
        [ -n "$MEMORY_RECALL_MAX_TOOL_CALLS" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_RECALL_MAX_TOOL_CALLS"
        [ -n "$MEMORY_EMBEDDINGS_MODEL" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_EMBEDDINGS_MODEL"
        [ -n "$MEMORY_RETAIN_CHUNK_SIZE" ] && DOCKER_ARGS="$DOCKER_ARGS -e MEMORY_RETAIN_CHUNK_SIZE"

        # Build codespy command arguments
        CMD_ARGS="review ${{ steps.pr-url.outputs.url }}"
        CMD_ARGS="$CMD_ARGS --output ${{ inputs.output-format }}"
        
        # Add git comment flag
        if [ "${{ inputs.post-comment }}" = "true" ]; then
          CMD_ARGS="$CMD_ARGS --git-comment"
        else
          CMD_ARGS="$CMD_ARGS --no-git-comment"
        fi
        
        # Create output file for capturing review
        OUTPUT_FILE=$(mktemp)
        
        # Run codespy in Docker
        docker run $DOCKER_ARGS \
          ghcr.io/khezen/codespy:${{ inputs.codespy-version }} \
          $CMD_ARGS | tee "$OUTPUT_FILE"
        
        # Extract issue counts from output
        REVIEW_OUTPUT=$(cat "$OUTPUT_FILE")
        
        # Parse issue counts from markdown output
        # Matches lines like: - **Total Issues:** 5
        TOTAL_ISSUES=$(echo "$REVIEW_OUTPUT" | grep -oP '\*\*Total Issues:\*\*\s+\K\d+' || echo "0")
        CRITICAL_COUNT=$(echo "$REVIEW_OUTPUT" | grep -oP '\*\*Critical:\*\*\s+\K\d+' || echo "0")
        HIGH_COUNT=$(echo "$REVIEW_OUTPUT" | grep -oP '\*\*High:\*\*\s+\K\d+' || echo "0")
        
        # Set outputs
        echo "issues-count=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
        echo "critical-count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
        echo "high-count=$HIGH_COUNT" >> $GITHUB_OUTPUT
        
        # Store full output (escape for multiline)
        {
          echo 'review-output<<EOF'
          cat "$OUTPUT_FILE"
          echo 'EOF'
        } >> $GITHUB_OUTPUT
        
        rm -f "$OUTPUT_FILE"

    - name: Check for critical issues
      if: inputs.fail-on-critical == 'true'
      shell: bash
      run: |
        if [ "${{ steps.review.outputs.critical-count }}" -gt "0" ]; then
          echo "::error::CodeSpy found ${{ steps.review.outputs.critical-count }} critical issue(s). Failing the action as requested."
          exit 1
        fi