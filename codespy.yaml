# codespy.yaml - Configuration file for codespy
#
# ENVIRONMENT VARIABLE OVERRIDES:
# All settings can be overridden via environment variables using the YAML path,
# uppercased and joined with underscores. The llm., memory.hippocampus.,
# memory.cerebral. and memory.prefrontal. segments are dropped; llm.retries,
# llm.timeout and memory.prefrontal.reflects keep their full names.
# Examples:
#   - llm.default_model → DEFAULT_MODEL
#   - llm.retries → LLM_RETRIES
#   - review.code_review.max_iters → REVIEW_CODE_REVIEW_MAX_ITERS
#   - memory.hippocampus.distiller.model → MEMORY_DISTILLER_MODEL
#   - memory.cerebral.retain.model → MEMORY_RETAIN_MODEL
#   - memory.cerebral.consolidation.model → MEMORY_CONSOLIDATION_MODEL
#   - memory.cerebral.mental_models.model → MEMORY_MENTAL_MODELS_MODEL
#   - memory.cerebral.mental_models.max_tokens → MEMORY_MENTAL_MODELS_MAX_TOKENS
#   - memory.cerebral.mental_models.min_refresh_seconds → MEMORY_MENTAL_MODELS_MIN_REFRESH_SECONDS
#   - memory.prefrontal.reflects → MEMORY_PREFRONTAL_REFLECTS
#   - memory.prefrontal.recall.model → MEMORY_RECALL_MODEL
#   - memory.prefrontal.recall.reach → MEMORY_RECALL_REACH
#   - memory.prefrontal.recall.max_tokens → MEMORY_RECALL_MAX_TOKENS
#   - memory.prefrontal.recall.max_tool_tokens → MEMORY_RECALL_MAX_TOOL_TOKENS
#   - memory.prefrontal.recall.max_tool_calls → MEMORY_RECALL_MAX_TOOL_CALLS
#
# Provider credentials keep their standard names:
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, AWS_*, AZURE_*
#
# Priority: Environment Variables > YAML Config > Defaults

# ============================================================================
# LLM ACCESS
# ============================================================================
llm:
  # OpenAI
  openai_api_key: null                   # OPENAI_API_KEY
  openai_api_base: null                  # OPENAI_API_BASE
  auto_discover_openai: true             # AUTO_DISCOVER_OPENAI

  # Anthropic
  anthropic_api_key: null                # ANTHROPIC_API_KEY
  auto_discover_anthropic: true          # AUTO_DISCOVER_ANTHROPIC

  # Google Gemini
  gemini_api_key: null                   # GEMINI_API_KEY
  auto_discover_gemini: true             # AUTO_DISCOVER_GEMINI

  # AWS Bedrock
  aws_region: us-east-1                  # AWS_REGION
  aws_access_key_id: null                # AWS_ACCESS_KEY_ID
  aws_secret_access_key: null            # AWS_SECRET_ACCESS_KEY
  aws_profile: null                      # AWS_PROFILE
  auto_discover_aws: true                # AUTO_DISCOVER_AWS

  # Azure OpenAI
  azure_api_key: null                    # AZURE_API_KEY
  azure_api_base: null                   # AZURE_API_BASE
  azure_api_version: null                # AZURE_API_VERSION

  # Default model settings
  default_model: bedrock/converse/nvidia.nemotron-nano-3-30b        # DEFAULT_MODEL
  extraction_model: bedrock/converse/nvidia.nemotron-nano-3-30b   # EXTRACTION_MODEL (falls back to default_model; also used by Cerebral two-step structured output for memory models litellm cannot schema-enforce)
  default_max_iters: 5                                              # DEFAULT_MAX_ITERS
  default_max_llm_calls: 8                                        # DEFAULT_MAX_LLM_CALLS
  default_reasoning_effort: medium                                  # DEFAULT_REASONING_EFFORT
  default_temperature: 1.0                                          # DEFAULT_TEMPERATURE
  default_max_tokens: 32000                                       # DEFAULT_MAX_TOKENS

  # Global LLM reliability settings
  retries: 2                              # LLM_RETRIES
  timeout: 240                            # LLM_TIMEOUT

  # RLM Fallback (context rot prevention)
  rlm_fallback:
    enabled: true                         # RLM_FALLBACK_ENABLED
    react_threshold: 0.30                 # RLM_FALLBACK_REACT_THRESHOLD
    chain_of_thought_threshold: 0.40      # RLM_FALLBACK_CHAIN_OF_THOUGHT_THRESHOLD
    predict_threshold: 0.50               # RLM_FALLBACK_PREDICT_THRESHOLD

# ============================================================================
# GIT PLATFORMS
# ============================================================================
github:
  token: null                            # GITHUB_TOKEN (auto-discovered if not set)
  auto_discover_token: true              # GITHUB_AUTO_DISCOVER_TOKEN

gitlab:
  token: null                            # GITLAB_TOKEN (auto-discovered if not set)
  url: https://gitlab.com                # GITLAB_URL
  auto_discover_token: true              # GITLAB_AUTO_DISCOVER_TOKEN

# ============================================================================
# MEMORY
# ============================================================================
memory:
  # PostgreSQL connection
  postgres:
    host: null                            # MEMORY_POSTGRES_HOST
    port: 5432                            # MEMORY_POSTGRES_PORT
    user: null                            # MEMORY_POSTGRES_USER
    password: null                        # MEMORY_POSTGRES_PASSWORD
    database: codespy                     # MEMORY_POSTGRES_DATABASE
    schema: episodic                      # MEMORY_POSTGRES_SCHEMA

  # pg0-embedded settings
  pg0:
    name: codespy                         # MEMORY_PG0_NAME
    port: null                            # MEMORY_PG0_PORT
    data_dir: null                        # MEMORY_PG0_DATA_DIR

  # Master switch
  enabled: false                          # MEMORY_ENABLED
  bank_id: null                           # MEMORY_BANK_ID

  # Hippocampus (episodic memory)
  hippocampus:
    compact_trajectory: true              # MEMORY_COMPACT_TRAJECTORY
    max_hippocampus_tokens: 16384         # MEMORY_MAX_HIPPOCAMPUS_TOKENS
    max_hippocampus_item_tokens: 512      # MEMORY_MAX_HIPPOCAMPUS_ITEM_TOKENS
    max_trajectory_tokens: 16384          # MEMORY_MAX_TRAJECTORY_TOKENS
    max_question_tokens: 8192             # MEMORY_MAX_QUESTION_TOKENS
    distiller:
      model: bedrock/converse/nvidia.nemotron-super-3-120b     # MEMORY_DISTILLER_MODEL
      reasoning_effort: null              # MEMORY_DISTILLER_REASONING_EFFORT
      temperature: null                   # MEMORY_DISTILLER_TEMPERATURE
      max_tokens: null                    # MEMORY_DISTILLER_MAX_TOKENS
      max_iters: 1                        # MEMORY_DISTILLER_MAX_ITERS
      max_llm_calls: 2                    # MEMORY_DISTILLER_MAX_LLM_CALLS
    cartographer:
      model: bedrock/converse/nvidia.nemotron-super-3-120b     # MEMORY_CARTOGRAPHER_MODEL
      reasoning_effort: null              # MEMORY_CARTOGRAPHER_REASONING_EFFORT
      temperature: null                   # MEMORY_CARTOGRAPHER_TEMPERATURE
      max_tokens: null                    # MEMORY_CARTOGRAPHER_MAX_TOKENS
      max_iters: 1                        # MEMORY_CARTOGRAPHER_MAX_ITERS
      max_llm_calls: 2                    # MEMORY_CARTOGRAPHER_MAX_LLM_CALLS

  # Cerebral (semantic memory)
  cerebral:
    retain:
      model: bedrock/converse/nvidia.nemotron-super-3-120b     # MEMORY_RETAIN_MODEL (falls back to llm.default_model)
      chunk_size: 12288                   # MEMORY_RETAIN_CHUNK_SIZE (chars, must be < 64000)
    consolidation:
      model: bedrock/converse/nvidia.nemotron-super-3-120b     # MEMORY_CONSOLIDATION_MODEL (falls back to retain model → default)
      max_observations_per_scope: 100   # MEMORY_CONSOLIDATION_MAX_OBSERVATIONS_PER_SCOPE (-1 = unlimited, 0 = no new observations)
    mental_models:
      model: bedrock/converse/nvidia.nemotron-super-3-120b     # MEMORY_MENTAL_MODELS_MODEL (briefing refresh; falls back to prefrontal model → retain → default)
      max_tokens: 2048                    # MEMORY_MENTAL_MODELS_MAX_TOKENS (briefing length)
      min_refresh_seconds: 0              # MEMORY_MENTAL_MODELS_MIN_REFRESH_SECONDS (0 = refresh after every consolidation; N = at most one automatic briefing refresh per N seconds, nothing lost thanks to delta)
    embeddings:
      model: bedrock/cohere.embed-v4:0                         # MEMORY_EMBEDDINGS_MODEL (auto-derived from provider)
      max_input_chars: null               # MEMORY_EMBEDDINGS_MAX_INPUT_CHARS (null=auto per model, e.g. 2048 for Bedrock Cohere v3; 0=off)

  # Prefrontal (semantic recall from Cerebral into agent context: read-only)
  prefrontal:
    reflects: 3                       # MEMORY_PREFRONTAL_REFLECTS (reflect iterations for recall and briefings; 0 = raw-fact recall, no LLM, no briefings)
    recall:
      model: bedrock/converse/nvidia.nemotron-super-3-120b     # MEMORY_RECALL_MODEL (reflect; also briefings fallback unless cerebral.mental_models.model set)
      reach: org                      # MEMORY_RECALL_REACH (local | org | bank)
      max_tokens: 8192                # MEMORY_RECALL_MAX_TOKENS (pre-call context budget)
      max_tool_tokens: 2048           # MEMORY_RECALL_MAX_TOOL_TOKENS (tool result budget)
      max_tool_calls: 0                 # MEMORY_RECALL_MAX_TOOL_CALLS (0 = recall_memory tool off)

# ============================================================================
# REVIEW
# ============================================================================
review:
  min_confidence: 0.81                    # REVIEW_MIN_CONFIDENCE
  output_format: markdown                 # REVIEW_OUTPUT_FORMAT
  output_stdout: true                     # REVIEW_OUTPUT_STDOUT
  output_git: true                        # REVIEW_OUTPUT_GIT
  cache_dir: ~/.cache/codespy             # REVIEW_CACHE_DIR

  excluded_directories:                   # REVIEW_EXCLUDED_DIRECTORIES (JSON array in env)
    - vendor
    - node_modules
    - third_party
    - external
    - deps
    - _vendor
    - vendored
    - dist
    - build
    - out
    - target
    - .bundle
    - Pods
    - Carthage
    - bower_components
    - jspm_packages
    - .git
    - .svn
    - .hg
    - __pycache__
    - .cache
    - .pytest_cache
    - .mypy_cache
    - .ruff_cache

  # Supply Chain Security
  supply_chain:
    enabled: true                                                 # REVIEW_SUPPLY_CHAIN_ENABLED
    max_iters: null                                               # REVIEW_SUPPLY_CHAIN_MAX_ITERS
    max_llm_calls: null                                           # REVIEW_SUPPLY_CHAIN_MAX_LLM_CALLS
    model: bedrock/converse/nvidia.nemotron-super-3-120b         # REVIEW_SUPPLY_CHAIN_MODEL
    reasoning_effort: null                                        # REVIEW_SUPPLY_CHAIN_REASONING_EFFORT
    temperature: null                                             # REVIEW_SUPPLY_CHAIN_TEMPERATURE
    max_tokens: null                                              # REVIEW_SUPPLY_CHAIN_MAX_TOKENS
    scan_unchanged: false                                         # REVIEW_SUPPLY_CHAIN_SCAN_UNCHANGED
    memory:
      enabled: null                                               # REVIEW_SUPPLY_CHAIN_MEMORY_ENABLED

  # Code Review
  code_review:
    enabled: true                                                 # REVIEW_CODE_REVIEW_ENABLED
    max_iters: 5                                                  # REVIEW_CODE_REVIEW_MAX_ITERS
    max_llm_calls: 8                                              # REVIEW_CODE_REVIEW_MAX_LLM_CALLS
    model: bedrock/converse/global.anthropic.claude-opus-5-5     # REVIEW_CODE_REVIEW_MODEL
    reasoning_effort: null                                        # REVIEW_CODE_REVIEW_REASONING_EFFORT
    temperature: null                                             # REVIEW_CODE_REVIEW_TEMPERATURE
    max_tokens: null                                              # REVIEW_CODE_REVIEW_MAX_TOKENS
    memory:
      enabled: null                                               # REVIEW_CODE_REVIEW_MEMORY_ENABLED

  # Documentation Review
  doc:
    enabled: true                                                 # REVIEW_DOC_ENABLED
    max_iters: 2                                                  # REVIEW_DOC_MAX_ITERS
    max_llm_calls: 4                                              # REVIEW_DOC_MAX_LLM_CALLS
    model: bedrock/converse/global.anthropic.claude-opus-5-5     # REVIEW_DOC_MODEL
    reasoning_effort: null                                        # REVIEW_DOC_REASONING_EFFORT
    temperature: null                                             # REVIEW_DOC_TEMPERATURE
    max_tokens: null                                              # REVIEW_DOC_MAX_TOKENS
    memory:
      enabled: null                                               # REVIEW_DOC_MEMORY_ENABLED

  # Scope Identification
  scope:
    enabled: true                                                 # REVIEW_SCOPE_ENABLED
    max_iters: 3                                                  # REVIEW_SCOPE_MAX_ITERS
    max_llm_calls: 5                                              # REVIEW_SCOPE_MAX_LLM_CALLS
    model: bedrock/converse/global.anthropic.claude-opus-5-5     # REVIEW_SCOPE_MODEL
    reasoning_effort: null                                        # REVIEW_SCOPE_REASONING_EFFORT
    temperature: null                                             # REVIEW_SCOPE_TEMPERATURE
    max_tokens: null                                              # REVIEW_SCOPE_MAX_TOKENS
    skip_refinement_when_clean: null                              # REVIEW_SCOPE_SKIP_REFINEMENT_WHEN_CLEAN
    memory:
      enabled: null                                               # REVIEW_SCOPE_MEMORY_ENABLED

  # Summary
  summary:
    enabled: true                                                 # REVIEW_SUMMARY_ENABLED
    max_iters: 1                                                  # REVIEW_SUMMARY_MAX_ITERS
    max_llm_calls: 2                                              # REVIEW_SUMMARY_MAX_LLM_CALLS
    model: bedrock/converse/nvidia.nemotron-super-3-120b         # REVIEW_SUMMARY_MODEL
    reasoning_effort: null                                        # REVIEW_SUMMARY_REASONING_EFFORT
    temperature: null                                             # REVIEW_SUMMARY_TEMPERATURE
    max_tokens: null                                              # REVIEW_SUMMARY_MAX_TOKENS
    memory:
      enabled: null                                               # REVIEW_SUMMARY_MEMORY_ENABLED

  # Audit
  audit:
    enabled: true                                                 # REVIEW_AUDIT_ENABLED
    max_iters: 1                                                  # REVIEW_AUDIT_MAX_ITERS
    max_llm_calls: 2                                              # REVIEW_AUDIT_MAX_LLM_CALLS
    model: bedrock/converse/global.anthropic.claude-opus-5-5     # REVIEW_AUDIT_MODEL
    reasoning_effort: null                                        # REVIEW_AUDIT_REASONING_EFFORT
    temperature: null                                             # REVIEW_AUDIT_TEMPERATURE
    max_tokens: null                                              # REVIEW_AUDIT_MAX_TOKENS
    memory:
      enabled: null                                               # REVIEW_AUDIT_MEMORY_ENABLED
